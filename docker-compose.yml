services:
  db:
    image: postgres:16-alpine
    container_name: kodomo_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kodomo_tracker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kodomo_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: kodomo_tracker_api
    working_dir: /workspaces/KodomoTracker/backend
    volumes:
      - .:/workspaces/KodomoTracker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/kodomo_tracker
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -r requirements.txt &&
             python -m app.init_db &&
             uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
